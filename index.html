<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fase Final</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="pagina">

  <header class="encabezado">

    <h1 class="titulo">
      FASE FINAL
    </h1>

    <div class="subtitulo">
      TORNEO
    </div>

    <div class="linea-titulo"></div>

  </header>


  <div class="ayuda-scroll">
    Desliza hacia la derecha →
  </div>


  <div class="scroll-torneo">

    <main class="bracket">


      <!-- OCTAVOS -->

      <section class="ronda octavos">

        <div class="nombre-ronda">
          OCTAVOS DE FINAL
        </div>

        <div class="fecha-ronda">
          16 equipos
        </div>

        <div
          class="partidos"
          id="octavos"
        ></div>

      </section>



      <!-- CUARTOS -->

      <section class="ronda cuartos">

        <div class="nombre-ronda">
          CUARTOS DE FINAL
        </div>

        <div class="fecha-ronda">
          8 equipos
        </div>

        <div
          class="partidos"
          id="cuartos"
        ></div>

      </section>



      <!-- SEMIFINALES -->

      <section class="ronda semifinales">

        <div class="nombre-ronda">
          SEMIFINALES
        </div>

        <div class="fecha-ronda">
          4 equipos
        </div>

        <div
          class="partidos"
          id="semifinales"
        ></div>

      </section>



      <!-- FINAL -->

      <section class="ronda final">

        <div class="nombre-ronda">
          FINAL
        </div>

        <div class="fecha-ronda">
          2 equipos
        </div>

        <div
          class="partidos"
          id="final"
        ></div>

      </section>



      <!-- CAMPEÓN -->

      <section class="ronda campeon-ronda">

        <div
          class="campeon"
          id="campeon"
        ></div>

      </section>


    </main>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
